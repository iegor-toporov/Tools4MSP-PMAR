services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PYGEOAPI_CONFIG_SRC: /app/pygeoapi-config.yml
      PYGEOAPI_CONFIG: /tmp/pygeoapi-runtime.yml
      PYGEOAPI_OPENAPI: /tmp/pygeoapi-openapi.yml
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./cache:/app/cache
      - ./out:/app/out
      - ./scenarios:/app/scenarios
      # Benchmark harness: the code goes in and the result CSV files come out.
      # Mounted, not copied into the image, so the measurements stay on the host.
      - ./bench:/app/bench
    expose:
      - "5001"
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
    # PMAR and connectivity analyses (default queue), in parallel.
    command: ["celery", "-A", "worker.app", "worker", "-Q", "celery", "--loglevel=info", "--concurrency=3"]
    volumes:
      - ./cache:/app/cache
      - ./out:/app/out
      - ./scenarios:/app/scenarios
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  # OpenDrift simulations (precompute): a single process, one simulation at a time;
  # the others wait in the `simulations` queue and are shown as "queued".
  # Each simulation runs in a new process (--max-tasks-per-child=1): the memory goes
  # back to the system at the end of the run, and the peak recorded in the scenario is
  # that of the run.
  simulation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      PMAR_SIMULATION_WORKER: "1"
    command: ["celery", "-A", "worker.app", "worker", "-Q", "simulations", "-n", "simulations@%h",
              "--loglevel=info", "--concurrency=1", "--max-tasks-per-child=1"]
    volumes:
      - ./cache:/app/cache
      - ./out:/app/out
      - ./scenarios:/app/scenarios
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:5001
    networks:
      - traefik
      - internal
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_geonode_webgateway"
      - "traefik.http.routers.ogcapi.rule=Host(`ogcapi.tools4msp.eu`)"
      - "traefik.http.routers.ogcapi.entrypoints=websecure"
      - "traefik.http.routers.ogcapi.tls.certresolver=le"
      - "traefik.http.services.ogcapi.loadbalancer.server.port=80"

volumes:
  redis-data:

networks:
  traefik:
    external: true
    name: traefik_geonode_webgateway
  internal:
