services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - git_token
    restart: unless-stopped
    env_file: .env
    environment:
      PYGEOAPI_CONFIG_SRC: /app/pygeoapi-config.yml
      PYGEOAPI_CONFIG: /tmp/pygeoapi-runtime.yml
      PYGEOAPI_OPENAPI: /tmp/pygeoapi-openapi.yml
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./cache:/app/cache
      - ./out:/app/out
      - ./simulations:/app/simulations
    expose:
      - "5001"
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - git_token
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "worker.app", "worker", "--loglevel=info", "--concurrency=4"]
    volumes:
      - ./cache:/app/cache
      - ./out:/app/out
      - ./simulations:/app/simulations
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - traefik
      - internal
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_geonode_webgateway"
      - "traefik.http.routers.ogcapi.rule=Host(`ogcapi.tools4msp.eu`)"
      - "traefik.http.routers.ogcapi.entrypoints=websecure"
      - "traefik.http.routers.ogcapi.tls.certresolver=le"
      - "traefik.http.services.ogcapi.loadbalancer.server.port=80"

volumes:
  redis-data:

networks:
  traefik:
    external: true
    name: traefik_geonode_webgateway
  internal:

secrets:
  git_token:
    file: ./.git_token